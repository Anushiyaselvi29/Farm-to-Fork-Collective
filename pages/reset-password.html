<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Farm to Fork Collective</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Mukta+Malar:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #22c55e;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 10% 20%, rgba(220, 252, 231, 0.75) 0%, transparent 45%),
                        radial-gradient(circle at 90% 80%, rgba(254, 243, 199, 0.75) 0%, transparent 45%),
                        linear-gradient(135deg, #f0fdf4 0%, #fffbeb 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
        }
        .reset-card {
            background: #ffffff;
            border: 1px solid rgba(45, 106, 79, 0.15);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 38px 34px;
            box-shadow: 0 25px 65px -15px rgba(27, 67, 50, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.9);
            text-align: center;
            position: relative;
        }
        .brand-badge {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ecfdf5;
            color: var(--primary);
            font-size: 1.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid #bbf7d0;
        }
        .reset-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .reset-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .target-email-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 22px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            color: #334155;
        }
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .form-input {
            width: 100%;
            height: 46px;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.94rem;
            outline: none;
            transition: all 0.25s;
        }
        .password-wrapper .form-input {
            padding-right: 44px;
        }
        .form-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3.5px rgba(22, 163, 74, 0.14);
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
        }
        .password-toggle:hover { color: var(--primary); }
        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.28);
            transition: all 0.25s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(22, 163, 74, 0.38);
        }
        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.86rem;
            margin-bottom: 16px;
            text-align: left;
            display: none;
        }
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }
        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }
        .back-link {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 0.86rem;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('ftf_theme') || localStorage.getItem('farmToForkTheme') || 'emerald';
            const active = (theme === 'dark') ? 'midnight' : (theme === 'light' ? 'emerald' : theme);
            document.documentElement.setAttribute('data-theme', active);
            if (active === 'midnight') document.documentElement.classList.add('dark-theme');
            const lang = localStorage.getItem('ftf_lang') || 'en';
            document.documentElement.setAttribute('lang', lang);
        })();
    </script>
</head>
<body>

    <div class="reset-card">
        <div class="brand-badge">
            <i class="fas fa-key"></i>
        </div>

        <h1 class="reset-title">Change Password</h1>
        <p class="reset-desc">Set a secure new password for your Farm to Fork Collective account.</p>

        <div id="emailPill" class="target-email-pill" style="display: none;">
            <i class="fas fa-user-check" style="color: var(--primary);"></i>
            <span id="targetEmailText"></span>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="resetForm" onsubmit="handleResetSubmit(event)">
            <!-- Email Input if not present in URL -->
            <div class="form-group" id="groupEmail">
                <label><i class="fas fa-envelope" style="color: var(--primary);"></i> Registered Email</label>
                <input type="email" id="inputEmail" class="form-input" placeholder="e.g. yourname@gmail.com" required>
            </div>

            <!-- OTP Input if not present in URL -->
            <div class="form-group" id="groupOtp">
                <label><i class="fas fa-shield-alt" style="color: var(--primary);"></i> 6-Digit Verification OTP</label>
                <input type="text" id="inputOtp" class="form-input" placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required style="font-family: monospace; letter-spacing: 4px;">
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock" style="color: var(--primary);"></i> New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="inputNewPassword" class="form-input" placeholder="At least 4 characters" minlength="4" required>
                    <button type="button" class="password-toggle" onclick="togglePass('inputNewPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-check-double" style="color: var(--primary);"></i> Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="inputConfirmPassword" class="form-input" placeholder="Re-enter new password" minlength="4" required>
                    <button type="button" class="password-toggle" onclick="togglePass('inputConfirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <i class="fas fa-check-circle"></i> Save New Password
            </button>
        </form>

        <div id="successPanel" style="display: none; padding-top: 10px;">
            <div style="font-size: 2.8rem; color: #16a34a; margin-bottom: 12px;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 8px;">Password Updated!</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.45;">
                Your password has been changed successfully. You can now sign in with your new password.
            </p>
            <a href="login.html" class="btn-submit" style="text-decoration: none;">
                <i class="fas fa-sign-in-alt"></i> Continue to Sign In
            </a>
        </div>

        <div>
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paramEmail = urlParams.get('email') || '';
        const paramToken = urlParams.get('token') || '';
        const paramOtp = urlParams.get('otp') || '';

        const inputEmail = document.getElementById('inputEmail');
        const inputOtp = document.getElementById('inputOtp');
        const groupEmail = document.getElementById('groupEmail');
        const groupOtp = document.getElementById('groupOtp');
        const emailPill = document.getElementById('emailPill');
        const targetEmailText = document.getElementById('targetEmailText');
        const alertBox = document.getElementById('alertBox');
        const resetForm = document.getElementById('resetForm');
        const successPanel = document.getElementById('successPanel');

        let isTokenValidated = false;

        function showAlert(msg, isSuccess = false) {
            alertBox.textContent = msg;
            alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        // Validate token with backend if present in URL
        async function validateUrlToken() {
            if (!paramToken) {
                // If no token, show normal email and OTP fields for manual entry
                if (paramEmail) {
                    inputEmail.value = paramEmail;
                    groupEmail.style.display = 'none';
                    emailPill.style.display = 'inline-flex';
                    targetEmailText.textContent = paramEmail;
                }
                if (paramOtp) {
                    inputOtp.value = paramOtp;
                    groupOtp.style.display = 'none';
                }
                return;
            }

            // Token present: validate with backend
            showAlert('Validating password reset link...', true);
            const btn = document.getElementById('btnSubmit');
            if (btn) btn.disabled = true;

            try {
                const raw = await fetch('/api/auth/validate-reset-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: paramToken, email: paramEmail })
                });
                const res = await raw.json();

                if (res && res.success) {
                    alertBox.style.display = 'none';
                    isTokenValidated = true;
                    if (btn) btn.disabled = false;

                    const verifiedEmail = res.email || paramEmail;
                    inputEmail.value = verifiedEmail;
                    groupEmail.style.display = 'none';
                    groupOtp.style.display = 'none';
                    emailPill.style.display = 'inline-flex';
                    targetEmailText.textContent = verifiedEmail;
                } else {
                    showAlert(res ? res.message : 'This password reset link is invalid or has expired. Please request a new one.');
                    resetForm.style.display = 'none';
                    // Provide button to request new link
                    const retryBtn = document.createElement('div');
                    retryBtn.style.marginTop = '18px';
                    retryBtn.innerHTML = `
                        <a href="login.html" class="btn-submit" style="text-decoration:none;">
                            <i class="fas fa-redo"></i> Request New Reset Link
                        </a>
                    `;
                    alertBox.parentElement.insertBefore(retryBtn, alertBox.nextSibling);
                }
            } catch (err) {
                showAlert('Could not verify reset link due to a network connection error. Please try again.');
                if (btn) btn.disabled = false;
            }
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        async function handleResetSubmit(e) {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = inputEmail.value.trim() || paramEmail;
            const otp = inputOtp.value.trim() || paramOtp;
            const p1 = document.getElementById('inputNewPassword').value;
            const p2 = document.getElementById('inputConfirmPassword').value;
            const btn = document.getElementById('btnSubmit');

            if (!email && !paramToken) {
                showAlert('Please enter your registered email address.');
                return;
            }

            if (!otp && !paramToken) {
                showAlert('Please enter the 6-digit OTP code sent to your email.');
                return;
            }

            if (p1 !== p2) {
                showAlert('New passwords do not match. Please verify.');
                return;
            }

            if (p1.length < 4) {
                showAlert('Password must be at least 4 characters long.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Password...';

            try {
                const payload = {
                    email,
                    otp,
                    token: paramToken,
                    newPassword: p1,
                    confirmPassword: p2
                };

                let res;
                if (window.FTF_API && window.FTF_API.auth && window.FTF_API.auth.resetPassword) {
                    res = await window.FTF_API.auth.resetPassword(payload);
                } else {
                    const raw = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    res = await raw.json();
                }

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Save New Password';

                if (res && res.success) {
                    resetForm.style.display = 'none';
                    successPanel.style.display = 'block';
                    emailPill.style.display = 'none';
                } else {
                    showAlert(res ? res.message : 'Error resetting password. Link or OTP may have expired.');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Save New Password';
                showAlert('Server connection error. Please try again.');
            }
        }

        // Initialize on load
        validateUrlToken();
    </script>
    <script src="../js/script.js"></script>
    <script src="../js/i18n.js"></script>
</body>
</html>

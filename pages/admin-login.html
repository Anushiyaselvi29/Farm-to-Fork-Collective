<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Farm to Fork Collective</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .admin-login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 48px 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .admin-login-container .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .admin-login-container .logo .shield-icon {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #C62828, #B71C1C);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: white;
            margin: 0 auto 16px;
            box-shadow: 0 8px 25px rgba(198, 40, 40, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .admin-login-container .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            margin-top: 8px;
        }

        .admin-login-container .logo p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .admin-login-container .logo .admin-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            background: linear-gradient(135deg, #C62828, #B71C1C);
            color: white;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus {
            border-color: #C62828;
            outline: none;
            box-shadow: 0 0 0 4px rgba(198, 40, 40, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #C62828, #B71C1C);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(198, 40, 40, 0.4);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn i {
            font-size: 1.1rem;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-home a:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .back-home a i {
            margin-right: 6px;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .security-badge i {
            color: #4CAF50;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @media (max-width: 480px) {
            .admin-login-container {
                padding: 30px 20px;
            }
            .admin-login-container .logo h1 {
                font-size: 1.5rem;
            }
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('ftf_theme') || localStorage.getItem('farmToForkTheme') || 'emerald';
            const active = (theme === 'dark') ? 'midnight' : (theme === 'light' ? 'emerald' : theme);
            document.documentElement.setAttribute('data-theme', active);
            if (active === 'midnight') document.documentElement.classList.add('dark-theme');
            const lang = localStorage.getItem('ftf_lang') || 'en';
            document.documentElement.setAttribute('lang', lang);
        })();
    </script>
</head>
<body>

<div class="admin-login-container">
    <div class="logo">
        <div class="shield-icon">
            <i class="fas fa-crown"></i>
        </div>
        <h1>Farm to Fork</h1>
        <p>Admin Panel Access</p>
        <span class="admin-badge"><i class="fas fa-shield-alt"></i> Secure Area</span>
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label><i class="fas fa-user" style="margin-right:6px; color:#C62828;"></i> Username</label>
            <input type="text" id="adminUser" placeholder="Enter admin username" required autofocus>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock" style="margin-right:6px; color:#C62828;"></i> Password</label>
            <input type="password" id="adminPass" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="login-btn">
            <i class="fas fa-shield-alt"></i> Admin Login
        </button>
    </form>

    <div class="back-home">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <div class="security-badge">
        <i class="fas fa-check-circle"></i>
        <span>Secure &bull; Authorized Personnel Only</span>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    async function handleAdminLogin(event) {
        event.preventDefault();

        const username = document.getElementById('adminUser').value.trim();
        const password = document.getElementById('adminPass').value.trim();

        // Call backend API if available
        let loginOk = false;
        if (window.FTF_API && window.FTF_API.auth) {
            try {
                const res = await window.FTF_API.auth.adminLogin(username, password);
                if (res && res.success) {
                    loginOk = true;
                }
            } catch (err) {
                console.warn('Backend unavailable, trying static check:', err);
            }
        }

        if (!loginOk && username === 'admin' && password === 'admin123') {
            localStorage.setItem('userName', 'Admin');
            localStorage.setItem('userRole', 'admin');
            localStorage.setItem('isLoggedIn', 'true');
            loginOk = true;
        }

        if (loginOk) {
            window.location.href = 'dashboard-admin.html';
        } else {
            const form = document.getElementById('adminLoginForm');
            form.classList.add('shake');

            const errorMsg = document.createElement('div');
            errorMsg.style.cssText = `
                background: rgba(198, 40, 40, 0.2);
                border: 1px solid #C62828;
                color: #ff6b6b;
                padding: 10px 16px;
                border-radius: 8px;
                margin-top: 12px;
                font-size: 0.85rem;
                text-align: center;
            `;
            errorMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Invalid username or password!';

            const oldError = form.querySelector('.error-msg');
            if (oldError) oldError.remove();

            form.appendChild(errorMsg);
            errorMsg.className = 'error-msg';

            setTimeout(() => {
                form.classList.remove('shake');
            }, 500);

            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminUser').focus();
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const form = document.getElementById('adminLoginForm');
            if (document.activeElement === document.getElementById('adminUser') ||
                document.activeElement === document.getElementById('adminPass')) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('adminUser').focus();
    });
</script>

    <script src="../js/script.js"></script>
    <script src="../js/i18n.js"></script>
</body>
</html>

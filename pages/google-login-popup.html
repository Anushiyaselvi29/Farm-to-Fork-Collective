<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Google Accounts...</title>
    <script>
        (function() {
            const clientId = '939090047671-otlai1n75lvc9mgass18jd721dpp8f36.apps.googleusercontent.com';
            const origin = window.location.origin;
            const redirectUri = origin + '/pages/oauth-callback.html';
            const scope = encodeURIComponent('openid email profile https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email');
            const googleAuthUrl = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(clientId) + '&redirect_uri=' + encodeURIComponent(redirectUri) + '&response_type=token&scope=' + scope + '&prompt=select_account&include_granted_scopes=true';
            window.location.replace(googleAuthUrl);
        })();
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
    <div style="text-align: center; padding: 24px;">
        <div style="font-size: 2rem; margin-bottom: 12px;">🌱</div>
        <h3 style="margin-bottom: 8px; color: #1e293b;">Connecting to Google Accounts...</h3>
        <p style="font-size: 0.9rem;">Opening Google's official account selector at accounts.google.com</p>
    </div>
</body>
</html>
